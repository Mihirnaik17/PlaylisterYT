name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Deploy server
        if: ${{ secrets.RENDER_SERVER_DEPLOY_HOOK != '' }}
        env:
          RENDER_SERVER_DEPLOY_HOOK: ${{ secrets.RENDER_SERVER_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$RENDER_SERVER_DEPLOY_HOOK"

      - name: Deploy client
        if: ${{ secrets.RENDER_CLIENT_DEPLOY_HOOK != '' }}
        env:
          RENDER_CLIENT_DEPLOY_HOOK: ${{ secrets.RENDER_CLIENT_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$RENDER_CLIENT_DEPLOY_HOOK"

      - name: Remind to configure deploy hooks
        if: ${{ secrets.RENDER_SERVER_DEPLOY_HOOK == '' && secrets.RENDER_CLIENT_DEPLOY_HOOK == '' }}
        run: |
          echo "::warning::No Render deploy hooks configured."
          echo "Add RENDER_SERVER_DEPLOY_HOOK and/or RENDER_CLIENT_DEPLOY_HOOK in GitHub → Settings → Secrets."
