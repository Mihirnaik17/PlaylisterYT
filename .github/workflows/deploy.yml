name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Deploy to Render
        env:
          RENDER_SERVER_DEPLOY_HOOK: ${{ secrets.RENDER_SERVER_DEPLOY_HOOK }}
          RENDER_CLIENT_DEPLOY_HOOK: ${{ secrets.RENDER_CLIENT_DEPLOY_HOOK }}
        run: |
          deployed=0

          if [ -n "$RENDER_SERVER_DEPLOY_HOOK" ]; then
            echo "Deploying server..."
            curl -fsS -X POST "$RENDER_SERVER_DEPLOY_HOOK"
            deployed=1
          else
            echo "RENDER_SERVER_DEPLOY_HOOK not set — skipping server deploy."
          fi

          if [ -n "$RENDER_CLIENT_DEPLOY_HOOK" ]; then
            echo "Deploying client..."
            curl -fsS -X POST "$RENDER_CLIENT_DEPLOY_HOOK"
            deployed=1
          else
            echo "RENDER_CLIENT_DEPLOY_HOOK not set — skipping client deploy."
          fi

          if [ "$deployed" -eq 0 ]; then
            echo "::warning::No Render deploy hooks configured."
            echo "Add RENDER_SERVER_DEPLOY_HOOK and/or RENDER_CLIENT_DEPLOY_HOOK in GitHub → Settings → Secrets."
          fi
